  </text>
  <text x="32" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c9d1d9">BOSS: AI business OS with chat, HR, accounting, inventory and local AI
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7692;0.7732;0.8422;0.8462;1" dur="45.5s" repeatCount="indefinite"/>
